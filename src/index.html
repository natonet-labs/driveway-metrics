<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driveway Metrics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #1a1a2e;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 600;
      margin: 0 0 24px;
      color: #1a1a2e;
    }

    .cards {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 32px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      min-width: 140px;
    }

    .card .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .card .value {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }

    .card.entries .value {
      color: #16a34a;
    }

    .card.exits .value {
      color: #dc2626;
    }

    .card.date .value {
      font-size: 1rem;
      font-weight: 500;
      color: #374151;
    }

    .section {
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      max-width: 860px;
      margin-left: auto;
      margin-right: auto;
    }

    .section h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 16px;
      color: #374151;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .no-data {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      padding: 32px 0;
    }
  </style>
</head>

<body>

  <h1>Driveway Counter</h1>

  <!-- Today summary cards -->
  <div class="cards">
    <div class="card date">
      <div class="label">Date</div>
      <div class="value" id="card-date">—</div>
    </div>
    <div class="card entries">
      <div class="label">Entries today</div>
      <div class="value" id="card-entries">—</div>
    </div>
    <div class="card exits">
      <div class="label">Exits today</div>
      <div class="value" id="card-exits">—</div>
    </div>
  </div>

  <p class="status" id="last-updated">Loading…</p>

  <!-- Intraday hourly chart -->
  <div class="section">
    <h2>Today — hourly activity</h2>
    <div id="hourly-no-data" class="no-data" style="display:none">
      No hourly snapshots yet. First upload arrives ~1 hour after the counter starts.
    </div>
    <canvas id="chart-hourly"></canvas>
  </div>

  <!-- 30-day history chart -->
  <div class="section">
    <h2>Last 30 days</h2>
    <div id="daily-no-data" class="no-data" style="display:none">
      No historical data yet.
    </div>
    <canvas id="chart-daily"></canvas>
  </div>

  <script>
    var API = 'https://driveway-metrics.natonet.workers.dev';
    var TOKEN_KEY = 'drivewayDashboardToken';

    // The Worker's read endpoints require the DASHBOARD_TOKEN secret. Ask for
    // it once and keep it in this browser; nothing secret lives in this file.
    function getToken() {
      var token = localStorage.getItem(TOKEN_KEY);
      if (!token) {
        token = (window.prompt('Dashboard access key:') || '').trim();
        if (token) localStorage.setItem(TOKEN_KEY, token);
      }
      return token;
    }

    function apiGet(path) {
      return fetch(API + path, {
        headers: { Authorization: 'Bearer ' + getToken() },
      }).then(function (r) {
        if (r.status === 401) {
          localStorage.removeItem(TOKEN_KEY);
          document.getElementById('last-updated').textContent =
            'Access key missing or invalid. Reload the page to enter it again.';
          throw new Error('unauthorized');
        }
        return r.json();
      });
    }
    var hourlyChart = null;
    var dailyChart = null;

    // Format hour number to "2 AM" / "3 PM" style
    function fmtHour(h) {
      if (h === 0) return '12 AM';
      if (h < 12) return h + ' AM';
      if (h === 12) return '12 PM';
      return (h - 12) + ' PM';
    }

    function setCards(date, entries, exits) {
      document.getElementById('card-date').textContent = date || '—';
      document.getElementById('card-entries').textContent = entries;
      document.getElementById('card-exits').textContent = exits;
    }

    function renderHourly(date, snapshots) {
      var canvas = document.getElementById('chart-hourly');
      var noData = document.getElementById('hourly-no-data');

      if (!snapshots || snapshots.length === 0) {
        canvas.style.display = 'none';
        noData.style.display = 'block';
        return;
      }
      canvas.style.display = 'block';
      noData.style.display = 'none';

      var labels = snapshots.map(function (s) { return fmtHour(s.hour); });
      var entries = snapshots.map(function (s) { return s.entries; });
      var exits = snapshots.map(function (s) { return s.exits; });

      if (hourlyChart) hourlyChart.destroy();
      hourlyChart = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Entries',
              data: entries,
              backgroundColor: 'rgba(22, 163, 74, 0.75)',
              borderColor: '#16a34a',
              borderWidth: 1,
              borderRadius: 4,
            },
            {
              label: 'Exits',
              data: exits,
              backgroundColor: 'rgba(220, 38, 38, 0.65)',
              borderColor: '#dc2626',
              borderWidth: 1,
              borderRadius: 4,
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'top' },
            tooltip: {
              callbacks: {
                title: function (items) {
                  return date + ' · ' + items[0].label;
                }
              }
            }
          },
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1 } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    function renderDaily(metrics) {
      var canvas = document.getElementById('chart-daily');
      var noData = document.getElementById('daily-no-data');

      if (!metrics || metrics.length === 0) {
        canvas.style.display = 'none';
        noData.style.display = 'block';
        return;
      }
      canvas.style.display = 'block';
      noData.style.display = 'none';

      // Dashboard returns newest-first; reverse so chart reads oldest→newest
      var data = metrics.slice().reverse();
      var labels = data.map(function (r) { return r.date.slice(5); }); // "MM-DD"
      var entries = data.map(function (r) { return r.entries; });
      var exits = data.map(function (r) { return r.exits; });

      if (dailyChart) dailyChart.destroy();
      dailyChart = new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Entries',
              data: entries,
              borderColor: '#16a34a',
              backgroundColor: 'rgba(22, 163, 74, 0.08)',
              fill: true,
              tension: 0.3,
              pointRadius: 3,
            },
            {
              label: 'Exits',
              data: exits,
              borderColor: '#dc2626',
              backgroundColor: 'rgba(220, 38, 38, 0.06)',
              fill: true,
              tension: 0.3,
              pointRadius: 3,
            }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'top' } },
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1 } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    function localDate() {
      var d = new Date();
      var yyyy = d.getFullYear();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      return yyyy + '-' + mm + '-' + dd;
    }

    function load() {
      var today = localDate();

      // Today's totals → update cards
      apiGet('/today?date=' + today)
        .then(function (d) {
          setCards(d.date, d.entries, d.exits);
          document.getElementById('last-updated').textContent =
            'Last updated: ' + new Date().toLocaleTimeString();
        })
        .catch(function (e) {
          if (e.message === 'unauthorized') return;
          document.getElementById('last-updated').textContent = 'Could not reach API';
        });

      // Hourly snapshots → intraday bar chart
      apiGet('/hourly?date=' + today)
        .then(function (d) {
          renderHourly(d.date, d.snapshots);
        })
        .catch(function () {
          renderHourly(null, []);
        });

      // 30-day history → daily line chart (unchanged)
      apiGet('/dashboard')
        .then(function (d) { renderDaily(d); })
        .catch(function () { renderDaily([]); });
    }

    load();
    // Refresh every 15 minutes — the Worker cache busts immediately on Pi upload,
    // so the dashboard updates within seconds of a new sync regardless of this interval.
    setInterval(load, 15 * 60 * 1000);
  </script>
</body>

</html>
